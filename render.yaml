services:
  - type: web
    name: innquietus-plataforma
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AES_KEY_B64
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JOBS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: TZ
        value: America/Mexico_City
      - key: SEED_ON_START
        value: "false"
